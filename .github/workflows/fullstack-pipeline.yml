name: Full-Stack DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

jobs:
  # 1. Security & Quality Scan
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # 2. Automated Semantic Versioning
  semantic-tag:
    needs: test-and-scan
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tagger.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tagger
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

  # 3. Build Multi-Arch Docker Images & Push to GHCR
  build-and-push:
    needs: semantic-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Frontend Build (amd64, arm64)
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}-frontend:${{ needs.semantic-tag.outputs.new_tag }}

      # Backend Build (amd64, arm64)
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}-backend:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}-backend:${{ needs.semantic-tag.outputs.new_tag }}

  # 4. GitHub Release Creation
  create-release:
    needs: [semantic-tag, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.semantic-tag.outputs.new_tag }}
          name: Release ${{ needs.semantic-tag.outputs.new_tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

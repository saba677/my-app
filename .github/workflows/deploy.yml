cp ~/inventory.ini ~/deploy-staging.yml .
name: CI/CD Pipeline with Manual Approval & Auto-Rollback

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Build and Tests
        run: |
          echo "Building application..."
          echo "Running unit tests... PASSED!"

  deploy-staging:
    name: Trigger Staging Deployment
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible
      - name: Deploy to Staging
        run: ansible-playbook -i inventory.ini deploy-staging.yml

  deploy-production:
    name: Deploy to Production (Manual Approval Required)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible

      - name: Run Production Ansible Playbook
        run: ansible-playbook -i inventory.ini deploy-prod.yml
